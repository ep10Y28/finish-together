<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finish Together</title>
  <meta name="description" content="Run club check-ins and AI-planned routes so every pace group finishes together.">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finish Together">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <img src="/static/icons/icon-192.png" alt="" width="34" height="34">
      <span>Finish Together</span>
    </a>
    <div class="top-actions">
      <span id="mode" class="badge" title="Whether the agents are using the AI model or the built-in rules">…</span>
      <button id="account" class="account" aria-label="Switch who you are">
        <span id="accountAvatar" class="avatar sm">?</span><span id="accountName">Sign in</span>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- Bottom sheet used for sign-in, check-in, new club -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/routes.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
